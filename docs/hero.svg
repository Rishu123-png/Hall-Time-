<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="HALLTIME exam hall clock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b120c"/>
      <stop offset="100%" stop-color="#152016"/>
    </linearGradient>
    <linearGradient id="digit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5c8"/>
      <stop offset="100%" stop-color="#9ecf4a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .colon { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.18} }
      .scan { animation: scan 4.5s linear infinite; }
      @keyframes scan { from{transform:translateY(-280px)} to{transform:translateY(280px)} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .bar { animation: bar 8s linear infinite; transform-origin: 48px 246px; }
      @keyframes bar { from{transform:scaleX(0.12)} to{transform:scaleX(1)} }
    </style>
  </defs>
  <rect width="920" height="280" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="917" height="277" rx="26.5" fill="none" stroke="#3d5a32" stroke-opacity=".55"/>
  <g class="scan" opacity=".12">
    <rect x="0" y="0" width="920" height="48" fill="#b6e86a"/>
  </g>
  <text x="48" y="48" fill="#9ecf4a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4">HALLTIME  ·  EXAM HALL CLOCK</text>
  <circle cx="868" cy="38" r="6" fill="#9ecf4a" class="pulse"/>
  <g filter="url(#glow)" font-family="ui-sans-serif, system-ui, Barlow Condensed, sans-serif" font-weight="800" fill="url(#digit)">
    <text x="48" y="168" font-size="118" letter-spacing="4">10</text>
    <text x="268" y="158" font-size="118" class="colon">:</text>
    <text x="318" y="168" font-size="118" letter-spacing="4">15</text>
    <text x="538" y="158" font-size="118" class="colon">:</text>
    <text x="588" y="168" font-size="118" letter-spacing="4">00</text>
  </g>
  <text x="48" y="214" fill="#c9d6b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Reading time  ·  Do not start writing  ·  पठन समय</text>
  <rect x="48" y="238" width="824" height="8" rx="4" fill="#1e2b1c"/>
  <rect class="bar" x="48" y="238" width="824" height="8" rx="4" fill="#9ecf4a"/>
</svg>
